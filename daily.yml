name: Update jobs daily — Briks

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch offres et générer le site
        env:
          FT_CLIENT_ID:       ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET:   ${{ secrets.FT_CLIENT_SECRET }}
          RECRUITCRM_API_KEY: ${{ secrets.RECRUITCRM_API_KEY }}
        run: python3 fetch.py

      - name: Push site and HelloWork size cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html hellowork_sizes.json
          git diff --cached --quiet || git commit -m "Update $(date +'%d/%m/%Y')"
          git pull --rebase --autostash origin main
          git push
