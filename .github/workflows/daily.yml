name: Update jobs daily — Briks

on:
  schedule:
    - cron: '0 7 * * *'   # 7h UTC = 8h Paris (hiver) / 9h (été)
  workflow_dispatch:       # lancement manuel possible

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install playwright playwright-stealth && python3 -m playwright install chromium --with-deps

      - name: Fetch offres et générer le site
        env:
          FT_CLIENT_ID:       ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET:   ${{ secrets.FT_CLIENT_SECRET }}
          APEC_EMAIL:         ${{ secrets.APEC_EMAIL }}
          APEC_PASSWORD:      ${{ secrets.APEC_PASSWORD }}
          RECRUITCRM_API_KEY: ${{ secrets.RECRUITCRM_API_KEY }}
        run: python3 fetch.py

      - name: Push docs/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Update $(date +'%d/%m/%Y')"
          git pull --rebase --autostash origin main
          git push

  # Job séparé : mise à jour du cache CRM (chaque dimanche)
  crm-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild CRM cache
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '0 7 * * 0')
        env:
          RECRUITCRM_API_KEY: ${{ secrets.RECRUITCRM_API_KEY }}
        run: python3 build_crm_cache.py

      - name: Push crm_cache.json
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '0 7 * * 0')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crm_cache.json
          git diff --cached --quiet || git commit -m "CRM cache $(date +'%d/%m/%Y')"
          git pull --rebase --autostash origin main
          git push
