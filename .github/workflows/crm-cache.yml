name: Rebuild CRM cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'   # chaque dimanche 6h UTC

jobs:
  crm-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild CRM cache
        env:
          RECRUITCRM_API_KEY: ${{ secrets.RECRUITCRM_API_KEY }}
        run: python3 build_crm_cache.py

      - name: Push crm_cache.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crm_cache.json
          git diff --cached --quiet || git commit -m "CRM cache $(date +'%d/%m/%Y')"
          git pull --rebase --autostash origin main
          git push
